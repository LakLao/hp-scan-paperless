configuration:
  printer_ip:
    name: Printer IP address
    description: Fixed IP of the HP printer (DHCP reservation in the router), e.g. 192.168.1.50
  label:
    name: Name on the printer
    description: Shown on the printer under Scan → Computer
  paperless_url:
    name: Paperless address
    description: e.g. https://paperless.example.com (without /api/...)
  paperless_token:
    name: Paperless API token
    description: Paperless → My Profile → API Auth Token
  resolution:
    name: Resolution (dpi)
    description: 300 is good for text recognition
  mode:
    name: Colour mode
    description: Gray keeps files small; Color for photos and coloured forms
  multi_page_pdf:
    name: Multi-page scan as one PDF
    description: All pages of one scan become one document (otherwise one document per page)
  emulated_duplex:
    name: Emulated two-sided scan
    description: Adds a second entry "<name> duplex" on the printer. Scan the fronts with it, flip the stack, scan the backs with it again; both are merged into one PDF
  duplex_mode:
    name: Two-sided page order
    description: document-wise = backs scanned after flipping the whole stack (usual for a document feeder)
  duplex_check:
    name: Check two-sided page count
    description: When fronts and backs of a two-sided scan have a different number of pages, fire the Home Assistant event hp_scan_duplex_mismatch (for a notification)
  incomplete_tag:
    name: Tag for incomplete scans
    description: Paperless tag given to a two-sided scan whose fronts and backs differ (created if missing). Leave empty to not tag
  remove_blank_pages:
    name: Leave out blank pages
    description: Blank pages (e.g. empty backs of a two-sided scan) are left out of the PDF before it goes to Paperless; the other pages keep their order
  blank_threshold:
    name: Blank page threshold (% ink)
    description: A page counts as blank below this share of its area with ink. Default 0.1 (dust, a staple or only a page number is blank; a signature or a line of text is not)
  debug:
    name: Debug log
    description: More details in the add-on log
